version: "2"
sql:
  - schema: "sql/schema"
    queries: "sql/queries"
    engine: "postgresql"
    gen:
      go:
        out: "internal/database"
        emit_json_tags: true
        overrides:
          - column: "users.hashed_password"
            go_struct_tag: 'json:"-"'
          - column: "movies.experience_types"
            go_type:
              import: "github.com/geneowak/go-expense-tracker/internal/types"
              type: "StringSlice"
