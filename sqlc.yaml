version: "2"
sql:
  - schema: "sql/schema"
    queries: "sql/queries"
    engine: "postgresql"
    gen:
      go:
        out: "internal/database"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "pg_catalog.timestamp"
            go_type:
              import: "time"
              type: Time
          - db_type: "pg_catalog.timestamp"
            nullable: true
            go_type:
              import: "time"
              type: Time
              pointer: true
          - db_type: "pg_catalog.time"
            go_type:
              import: "time"
              type: Time
          - column: "users.hashed_password"
            go_struct_tag: 'json:"-"'
          - column: "movies.experience_types"
            go_type:
              import: "github.com/geneowak/go-expense-tracker/internal/types"
              type: "StringSlice"
          - column: "movies.genre"
            go_type:
              import: "github.com/geneowak/go-expense-tracker/internal/types"
              type: "StringSlice"
          - column: "cinemas.experience_types"
            go_type:
              import: "github.com/geneowak/go-expense-tracker/internal/types"
              type: "StringSlice"
          - column: "cinemas.seat_map"
            go_type:
              import: "github.com/geneowak/go-expense-tracker/internal/types"
              type: "SeatMap"
